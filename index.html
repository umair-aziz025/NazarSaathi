<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f7fafc"/>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('nazarsaathi-theme');
        var good = ['daylight','sea-glass','midnight','contrast'];
        document.documentElement.dataset.theme = good.indexOf(t) >= 0 ? t : 'daylight';
      } catch(e) { document.documentElement.dataset.theme = 'daylight'; }
    })();
  </script>
  <meta name="description" content="NazarSaathi — a bilingual live vision assistant providing spoken object recognition, printed text reading and hands-free voice commands."/>
  <title>NazarSaathi | See Beyond Sight. Hear the World.</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<a href="#main" class="skip-link">Skip to application</a>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
